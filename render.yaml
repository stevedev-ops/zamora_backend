services:
  - type: web
    name: zamora-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zamora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORTAL_JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DARAJA_MODE
        value: simulation
      - key: SMS_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock

databases:
  - name: zamora-db
    plan: free
    databaseName: zamora_liquor
    user: zamora_user
